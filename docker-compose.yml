services:
  postgres:
    image: postgres:16-alpine
    container_name: distribuidor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: distribuidor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "56321:5432"
    volumes:
      - distribuidor_postgres_data:/var/lib/postgresql/data

volumes:
  distribuidor_postgres_data:
